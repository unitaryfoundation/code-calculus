# Pre-commit hooks: catch the cheap, common defects before CI.
# Install: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: mixed-line-ending
  - repo: local
    hooks:
      - id: no-conflict-markers
        name: no unresolved conflict markers
        entry: bash -c 'if grep -RInE "^(<<<<<<<|=======$|>>>>>>>)" . --include="*" 2>/dev/null | grep -v "^./.git/" | grep -v "^./.venv/" ; then exit 1; fi'
        language: system
        pass_filenames: false
      - id: doc-lint
        name: documentation consistency lint
        entry: sh scripts/lint_docs.sh
        language: system
        pass_filenames: false
        files: \.md$
