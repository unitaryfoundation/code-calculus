name: release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, tests, and conformance (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: machine/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r machine/requirements.txt
      - name: Documentation consistency lint
        run: sh scripts/lint_docs.sh
      - name: Tests (pytest)
        run: python -m pytest -q machine/
      - name: Full fixture-conformance evaluator
        run: python3 machine/fixture_conformance.py
      - name: Priced-conformance harness
        env:
          PRICED_CONFORMANCE_REPORT: "-"
        run: python3 machine/experiments/priced_conformance_harness.py
