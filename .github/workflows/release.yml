name: release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, tests, and conformance (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: machine/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r machine/requirements.txt
      - name: Documentation consistency lint
        run: sh scripts/lint_docs.sh
      - name: Tests (pytest)
        run: python -m pytest -q machine/
      - name: Full fixture-conformance evaluator
        run: python3 machine/fixture_conformance.py
      - name: Priced-conformance harness
        env:
          PRICED_CONFORMANCE_REPORT: "-"
        run: python3 machine/experiments/priced_conformance_harness.py

  lean:
    name: Lean build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: lean
