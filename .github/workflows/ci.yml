name: validation

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" "${{ github.sha }}" | grep -qE '^(machine|spec|lean|scripts|\.github/workflows)/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Lint, tests, and conformance
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: machine/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r machine/requirements.txt
      - name: Documentation consistency lint
        run: sh scripts/lint_docs.sh
      - name: Tests (pytest)
        if: needs.changes.outputs.code == 'true'
        run: python -m pytest -q machine/test_priced_calculus.py machine/test_fixture_conformance.py
      - name: Full fixture-conformance evaluator
        if: needs.changes.outputs.code == 'true'
        run: python3 machine/fixture_conformance.py
      - name: Priced-conformance harness
        if: needs.changes.outputs.code == 'true'
        run: python3 machine/experiments/priced_conformance_harness.py
