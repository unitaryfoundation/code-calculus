name: validation

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      lean: ${{ steps.filter.outputs.lean }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "lean=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          if echo "$changed" | grep -qE '^(machine|spec|lean|scripts|\.github/workflows)/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(lean/|spec/|machine/fixtures/mvp_fixtures\.json$)'; then
            echo "lean=true" >> "$GITHUB_OUTPUT"
          else
            echo "lean=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Lint, tests, and conformance
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: machine/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r machine/requirements.txt
      - name: Documentation consistency lint
        run: sh scripts/lint_docs.sh
      - name: Tests (pytest, smoke)
        if: needs.changes.outputs.code == 'true'
        run: python -m pytest -q machine/test_priced_calculus.py machine/test_fixture_conformance.py machine/test_pinned_replay.py machine/test_priced_conformance.py
      - name: Full fixture-conformance evaluator
        if: needs.changes.outputs.code == 'true'
        run: python3 machine/fixture_conformance.py
      - name: Priced-conformance harness
        if: needs.changes.outputs.code == 'true'
        env:
          PRICED_CONFORMANCE_REPORT: "-"
        run: python3 machine/experiments/priced_conformance_harness.py
      - name: Symplectic-conformance harness
        if: needs.changes.outputs.code == 'true'
        env:
          SYMPLECTIC_CONFORMANCE_REPORT: "-"
        run: python3 machine/experiments/symplectic_conformance_harness.py
      - name: Layout-conformance harness
        if: needs.changes.outputs.code == 'true'
        env:
          LAYOUT_CONFORMANCE_REPORT: "-"
        run: python3 machine/experiments/layout_conformance_harness.py

  lean:
    name: Lean build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.lean == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: lean
