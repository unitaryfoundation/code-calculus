name: weekly-deep-validation

permissions:
  contents: read

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep-validation:
    name: Full validation (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: unitaryfoundation/qldpc-challenge
          ref: 9d30c66a43bf7c275196267d369ddab171bfd72f
          path: qldpc-challenge
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: machine/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r machine/requirements.txt
      - name: Install the pinned challenge verifier's dependency
        run: python -m pip install numpy==2.3.5
      - name: Verify the pinned challenge checkout is clean
        working-directory: qldpc-challenge
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "qldpc-challenge working tree is not clean" >&2
            git status --porcelain >&2
            exit 1
          fi
      - name: Full test suite (scaled)
        env:
          RUN_SCALED_CONFORMANCE: "1"
          SCALED_CASES: "2000"
        run: python -m pytest -q machine/
      - name: Full fixture-conformance evaluator
        run: python3 machine/fixture_conformance.py
      - name: Priced-conformance harness
        run: python3 machine/experiments/priced_conformance_harness.py
      - name: Symplectic-conformance harness
        run: python3 machine/experiments/symplectic_conformance_harness.py
      - name: Layout-conformance harness
        run: python3 machine/experiments/layout_conformance_harness.py
      - name: Pinned qLDPC replay
        run: python3 machine/experiments/issue21_challenge_replay.py qldpc-challenge
      - name: Asserted discovery-loop stress battery
        run: python3 machine/experiments/stress_campaign.py --challenge-root qldpc-challenge --output /tmp/stress_campaign_metrics.json
      - name: Upload stress-battery metrics artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-campaign-metrics
          path: /tmp/stress_campaign_metrics.json
          if-no-files-found: warn

  lean:
    name: Lean build (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: lean
